<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HTML、CSS、JavaScriptだけで作った横スクロールアクションゲーム">
  <title>Pixel Runner - 横スクロールアクション</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">HTML / CSS / JAVASCRIPT</p>
        <h1>PIXEL RUNNER</h1>
      </div>
      <button id="restart-button" class="restart-button" type="button">↻ リスタート</button>
    </header>

    <section class="game-card" aria-label="横スクロールアクションゲーム">
      <div class="hud">
        <div class="stat">
          <span class="stat-label">SCORE</span>
          <strong id="score">000000</strong>
        </div>
        <div class="stat">
          <span class="stat-label">COINS</span>
          <strong id="coins">0 / 8</strong>
        </div>
        <div class="stat">
          <span class="stat-label">LIFE</span>
          <strong id="lives" aria-label="残りライフ">♥ ♥ ♥</strong>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="game-canvas" width="960" height="540" aria-label="ゲーム画面"></canvas>
        <div id="message" class="message" hidden>
          <p id="message-kicker">STAGE CLEAR!</p>
          <h2 id="message-title">ゴールに到達しました</h2>
          <p id="message-detail">リスタートしてもう一度プレイできます。</p>
          <button id="message-button" type="button">もう一度遊ぶ</button>
        </div>
      </div>

      <div class="controls">
        <p><kbd>←</kbd><kbd>→</kbd> 移動　 <kbd>SPACE</kbd> ジャンプ　 <kbd>X</kbd> 攻撃</p>
        <p class="hint">敵は攻撃で倒せます。落下するとライフを失います。</p>
      </div>
      <div class="touch-controls" aria-label="タッチ操作">
        <button data-key="ArrowLeft" type="button" aria-label="左へ移動">←</button>
        <button data-key="ArrowRight" type="button" aria-label="右へ移動">→</button>
        <button data-key="Space" type="button" aria-label="ジャンプ">▲</button>
        <button data-key="KeyX" type="button" aria-label="攻撃">⚔</button>
      </div>
    </section>
    <footer>ゴールの旗を目指そう <span>•</span> 全8枚のコインを集めるとボーナス！</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
